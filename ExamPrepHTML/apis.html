<!DOCTYPE html>
<html lang="de-CH">

<head>
    <link rel="stylesheet" type="text/css" href="api-style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API's demo</title>
    <script src="apis.js"></script>
</head>

<body>
    <main>
        <div class="geolocation card">
            <div class="title">
                <h1>Geolocation</h1>
            </div>
            <div class="iframe">
                <button onClick="locateMe()">Locate me</button>
                <iframe width="100%" height="300px" id="geolocation-map"
                    src="https://www.openstreetmap.org/export/embed.html?bbox=8.50496292114258%2C47.34862244571515%2C8.571438789367678%2C47.384868612482634&amp;layer=mapnik"
                    style="border: none; transition: all 1s;"></iframe><br />
                <p id="geolocation-text" hidden></p>
                <p id="geolocation-link-text" hidden></p>
                <a id="geolocation-link" href="" target="_blank" hidden>Grössere Karte anzeigen</a>
            </div>
        </div>
        <div class="orientation card">
            <div class="title">
                <h1>Orientation</h1>
            </div>
            <div class="iframe">
                <p id="orientation-element">↑</p>
                <button onClick="startOrientation()">Start orientation</button>
            </div>
        </div>
        <div class="motion card">
            <div class="title">
                <h1>Motion</h1>
            </div>
            <div class="iframe">
                <p id="motion-element"></p>
                <div class="motion-bar x" id="motion-bar-x">X</div>
                <div class="motion-bar y" id="motion-bar-y">Y</div>
                <button onClick="startMotion()">Start motion</button>
            </div>
        </div>
    </main>
</body>

</html>
